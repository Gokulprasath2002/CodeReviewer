[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pr-reviewer"
version = "1.0.0"
description = "Repository-aware AI pull request reviewer"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.95", "uvicorn>=0.22", "pydantic>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
ai-review = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
